<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CrickBet - Cricket</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f5f8;
            color: #20242a;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================
           TOP HEADER
        ========================= */

        .topbar {
            height: 58px;
            background: #1976d2;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 25px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .18);
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: .5px;
            min-width: 145px;
        }

        .topbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .balance {
            background: rgba(255,255,255,.14);
            padding: 8px 13px;
            border-radius: 4px;
            font-size: 14px;
            margin-right: 5px;
        }

        .top-btn {
            border: 0;
            padding: 8px 13px;
            border-radius: 4px;
            color: #fff;
            background: rgba(255,255,255,.14);
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
        }

        .top-btn:hover {
            background: rgba(255,255,255,.25);
        }

        .logout-btn {
            background: #d32f2f;
        }

        .logout-btn:hover {
            background: #b71c1c;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .main-nav {
            height: 43px;
            background: #263238;
            display: flex;
            align-items: center;
            padding-left: 15px;
        }

        .main-nav a {
            color: #fff;
            text-decoration: none;
            padding: 13px 20px;
            height: 43px;
            font-size: 13px;
            font-weight: 600;
        }

        .main-nav a:hover,
        .main-nav a.active {
            background: #37474f;
        }

        /* =========================
           PAGE LAYOUT
        ========================= */

        .page-layout {
            display: flex;
            min-height: calc(100vh - 101px);
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 215px;
            flex-shrink: 0;
            background: #fff;
            border-right: 1px solid #dce1e6;
        }

        .sidebar-title {
            background: #eceff1;
            padding: 14px 16px;
            font-weight: 700;
            font-size: 14px;
            color: #263238;
            border-bottom: 1px solid #dce1e6;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 13px 16px;
            border: 0;
            background: #fff;
            border-bottom: 1px solid #edf0f2;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            color: #37474f;
        }

        .sidebar-item:hover {
            background: #f5f7f9;
        }

        .sidebar-item.active {
            background: #e3f2fd;
            color: #1565c0;
            font-weight: 700;
            border-left: 4px solid #1976d2;
            padding-left: 12px;
        }

        .sidebar-icon {
            width: 19px;
            text-align: center;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 18px;
        }

        .page-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 14px;
        }

        .page-heading h1 {
            margin: 0;
            font-size: 21px;
            color: #263238;
        }

        .page-heading small {
            color: #78909c;
        }

        .refresh-btn {
            border: 0;
            background: #1976d2;
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .refresh-btn:hover {
            background: #1565c0;
        }

        /* =========================
           FILTER BAR
        ========================= */

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .filter-btn {
            border: 1px solid #cfd8dc;
            background: #fff;
            color: #455a64;
            border-radius: 4px;
            padding: 8px 14px;
            font-size: 12px;
            cursor: pointer;
        }

        .filter-btn:hover {
            background: #f5f7f8;
        }

        .filter-btn.active {
            color: #fff;
            background: #1976d2;
            border-color: #1976d2;
        }

        /* =========================
           MATCH TABLE
        ========================= */

        .market-card {
            background: #fff;
            border: 1px solid #dfe4e8;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,.04);
        }

        .market-header {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) 105px 105px 105px 105px;
            background: #37474f;
            color: #fff;
            min-height: 42px;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
        }

        .market-header > div {
            padding: 11px 10px;
            text-align: center;
        }

        .market-header > div:first-child {
            text-align: left;
        }

        .market-header .back-head {
            background: #64b5f6;
            color: #102a43;
        }

        .market-header .lay-head {
            background: #ef9a9a;
            color: #5f1515;
        }

        .market-header .draw-head {
            background: #b0bec5;
            color: #263238;
        }

        .match-row {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) 105px 105px 105px 105px;
            min-height: 74px;
            align-items: stretch;
            border-top: 1px solid #e6eaed;
        }

        .match-row:hover {
            background: #fafbfc;
        }

        .match-info {
            padding: 10px 12px;
            min-width: 0;
            cursor: pointer;
        }

        .match-name {
            font-size: 14px;
            font-weight: 700;
            color: #263238;
            line-height: 1.4;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .match-meta {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 11px;
            color: #78909c;
        }

        .live-badge {
            background: #d32f2f;
            color: #fff;
            border-radius: 3px;
            padding: 2px 6px;
            font-weight: 700;
            font-size: 10px;
        }

        .upcoming-badge {
            background: #eceff1;
            color: #546e7a;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 10px;
        }

        .odds-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            border-left: 1px solid rgba(0,0,0,.04);
            cursor: pointer;
        }

        .back-cell {
            background: #e3f2fd;
            color: #0d47a1;
        }

        .back-cell:hover {
            background: #bbdefb;
        }

        .lay-cell {
            background: #ffebee;
            color: #b71c1c;
        }

        .lay-cell:hover {
            background: #ffcdd2;
        }

        .draw-cell {
            background: #f1f4f5;
            color: #455a64;
        }

        .draw-cell:hover {
            background: #e0e5e7;
        }

        .odds-pair {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .odds-value {
            font-size: 14px;
        }

        .odds-volume {
            font-size: 9px;
            font-weight: 400;
            opacity: .7;
        }

        /* =========================
           STATES
        ========================= */

        .state-box {
            padding: 45px 20px;
            text-align: center;
            color: #78909c;
            font-size: 13px;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e0e0e0;
            border-top-color: #1976d2;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-box {
            margin: 12px;
            padding: 12px;
            border-radius: 4px;
            background: #ffebee;
            border: 1px solid #ffcdd2;
            color: #b71c1c;
            font-size: 12px;
        }

        /* =========================
           BETSLIP
        ========================= */

        .betslip {
            margin-top: 15px;
            background: #fff;
            border: 1px solid #dfe4e8;
            border-radius: 4px;
            overflow: hidden;
        }

        .betslip-header {
            background: #37474f;
            color: #fff;
            padding: 11px 13px;
            font-size: 13px;
            font-weight: 700;
        }

        .betslip-body {
            padding: 14px;
            color: #78909c;
            font-size: 12px;
            text-align: center;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 950px) {
            .sidebar {
                width: 175px;
            }

            .market-header,
            .match-row {
                grid-template-columns: minmax(230px, 1fr) 80px 80px 80px 80px;
            }
        }

        @media (max-width: 700px) {
            .topbar {
                height: auto;
                min-height: 58px;
                padding: 8px 10px;
            }

            .brand {
                min-width: auto;
                font-size: 20px;
            }

            .balance {
                display: none;
            }

            .top-btn {
                padding: 7px 9px;
            }

            .main-nav {
                padding-left: 5px;
            }

            .main-nav a {
                padding: 13px 12px;
            }

            .page-layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid #dce1e6;
            }

            .sidebar-title {
                display: none;
            }

            .sidebar-item {
                display: inline-flex;
                width: auto;
                border-bottom: 0;
                padding: 9px 13px;
            }

            .sidebar-item.active {
                border-left: 0;
                border-bottom: 3px solid #1976d2;
                padding-left: 13px;
            }

            .main-content {
                padding: 10px;
            }

            .market-card {
                overflow-x: auto;
            }

            .market-header,
            .match-row {
                min-width: 680px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="brand">
            CRICBET
        </div>

        <div class="topbar-right">

            <div class="balance">
                Balance:
                ₹<span id="userBalance">{{ "%.2f"|format(user.balance or 0) }}</span>
            </div>

            <a href="/wallet/deposit" class="top-btn">
                Deposit
            </a>

            <a href="/wallet/withdraw" class="top-btn">
                Withdraw
            </a>

            <a href="/profile" class="top-btn">
                Profile
            </a>

            <a href="/logout" class="top-btn logout-btn">
                Logout
            </a>

        </div>

    </header>


    <!-- =========================
         MAIN NAV
    ========================== -->

    <nav class="main-nav">

        <a href="/dashboard">
            HOME
        </a>

        <a href="/dashboard" class="active">
            CRICKET
        </a>

    </nav>


    <!-- =========================
         PAGE
    ========================== -->

    <div class="page-layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-title">
                Cricket
            </div>

            <button
                class="sidebar-item active"
                data-filter="all"
            >
                <span class="sidebar-icon">🏏</span>
                <span>All Matches</span>
            </button>

            <button
                class="sidebar-item"
                data-filter="live"
            >
                <span class="sidebar-icon">🔴</span>
                <span>Live</span>
            </button>

            <button
                class="sidebar-item"
                data-filter="upcoming"
            >
                <span class="sidebar-icon">🕒</span>
                <span>Upcoming</span>
            </button>

        </aside>


        <!-- MAIN CONTENT -->

        <main class="main-content">

            <div class="page-heading">

                <div>
                    <h1>Cricket</h1>

                    <small id="matchCount">
                        Loading matches...
                    </small>
                </div>

                <button
                    id="refreshButton"
                    class="refresh-btn"
                    type="button"
                >
                    Refresh
                </button>

            </div>


            <!-- FILTERS -->

            <div class="filter-bar">

                <button
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="live"
                >
                    Live
                </button>

                <button
                    class="filter-btn"
                    data-filter="upcoming"
                >
                    Upcoming
                </button>

            </div>


            <!-- MATCH MARKET -->

            <section class="market-card">

                <div class="market-header">

                    <div>
                        Match
                    </div>

                    <div class="back-head">
                        BACK
                    </div>

                    <div class="lay-head">
                        LAY
                    </div>

                    <div class="draw-head">
                        DRAW
                    </div>

                    <div>
                        MARKET
                    </div>

                </div>


                <div id="matchesContainer">

                    <div class="state-box">

                        <div class="loading-spinner"></div>

                        Loading ProExch cricket matches...

                    </div>

                </div>

            </section>


            <!-- BETSLIP -->

            <section class="betslip">

                <div class="betslip-header">
                    Bet Slip
                </div>

                <div
                    id="betslipBody"
                    class="betslip-body"
                >
                    Select BACK or LAY odds from a match to add a selection.
                </div>

            </section>

        </main>

    </div>


    <!--
        Current user information is made available to dashboard.js
        without exposing any external API credentials.
    -->


    <script
        src="/static/js/dashboard.js?v=100"
        defer
    ></script>

</body>
</html>
