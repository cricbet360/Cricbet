{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Create Your Account</h2>

    <p class="card-subtitle">
        Join CrickBet and start betting on live sports.
    </p>

    {% if message %}
    <div class="alert">
        {{ message }}
    </div>
    {% endif %}

    <form method="POST" action="/register">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="form-footer">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

{% endblock %}
