{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Login</h2>

    {% if message %}
        <p style="color:red; text-align:center; margin-bottom:15px;">
            {{ message }}
        </p>
    {% endif %}

    <form method="POST" action="/login">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

{% endblock %}
